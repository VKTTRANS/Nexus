<div id="view-login" class="view-section active">
  <div class="d-flex justify-content-center align-items-center vh-100 position-relative overflow-hidden">
    
    <div class="bg-grid"></div>
    <div class="glass-shape shape-square shape-1"></div>
    <div class="glass-shape shape-circle shape-2"></div>
    <div class="glass-shape shape-square shape-3"></div>
    <div class="glass-shape shape-circle shape-4"></div>
    <div class="glass-shape shape-square shape-5"></div>
    <div class="glass-shape shape-circle shape-6"></div>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="card p-5 border-0 shadow-lg text-center position-relative login-card-animated" 
         style="width: 400px; background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6); z-index: 10;">
      
      <div class="mb-4">
        <div class="d-inline-flex align-items-center justify-content-center mb-3 rounded-circle position-relative icon-glow-animated" style="width: 85px; height: 85px; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0,230,118,0.3);">
           <i class="bi bi-shield-lock-fill text-success" style="font-size: 2.5rem; filter: drop-shadow(0 0 8px rgba(0,230,118,0.6));"></i>
        </div>
        <h3 class="fw-bold text-white mb-1" style="letter-spacing: 1.5px;">VKT NEXUS</h3>
        <p class="text-secondary small">ระบบจัดการฐานข้อมูลพนักงาน</p>
      </div>
      
      <form onsubmit="window.performLogin(event)">
        <div class="form-floating mb-3">
          <input type="text" class="form-control login-input" id="loginUser" placeholder="Username" required>
          <label for="loginUser"><i class="bi bi-person me-2"></i>ชื่อผู้ใช้งาน</label>
        </div>
        <div class="form-floating mb-4">
          <input type="password" class="form-control login-input" id="loginPass" placeholder="Password" required>
          <label for="loginPass"><i class="bi bi-key me-2"></i>รหัสผ่าน</label>
        </div>
        <button type="submit" class="btn btn-login-animated w-100 py-3 rounded-pill fw-bold shadow-sm text-dark" style="font-size: 1.1rem;">
            เข้าสู่ระบบ <i class="bi bi-arrow-right-short ms-1 fs-5 d-inline-block align-middle"></i>
        </button>

        <div class="mt-3">
            <a href="#" onclick="window.openRecoverModal(event)" class="text-success small text-decoration-none hover-scale d-inline-block fw-bold" style="transition: 0.3s; padding: 5px;">
                <i class="bi bi-search me-1"></i> ลืมรหัสผ่าน / ตรวจสอบบัญชีเข้าใช้งาน?
            </a>
        </div>
      </form>

      <div class="mt-4 text-muted small opacity-25 font-monospace">© 2026 VKT Transport System</div>
    </div>
  </div>

  <div class="modal fade" id="recoverModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content" style="background: rgba(20,20,20,0.98); border: 1px solid rgba(0, 230, 118, 0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
              <div class="modal-header border-bottom border-success border-opacity-25 pb-3">
                  <h5 class="modal-title fw-bold text-success">
                      <i class="bi bi-person-vcard me-2"></i>ตรวจสอบรหัสเข้าใช้งาน
                  </h5>
                  <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body p-4 text-start">
                  <form id="recoverForm" onsubmit="window.submitRecoverAccount(event)">
                      <div class="mb-3">
                          <label class="small text-muted mb-2 fw-bold">1. เลขบัตรประจำตัวประชาชน (13 หลัก)</label>
                          <input type="text" class="form-control bg-dark text-light border-success shadow-none font-monospace" id="recoverIdCard" placeholder="x-xxxx-xxxxx-xx-x" maxlength="13" required>
                      </div>
                      <div class="mb-3">
                          <label class="small text-muted mb-2 fw-bold">2. เบอร์โทรศัพท์ที่ลงทะเบียนไว้</label>
                          <input type="text" class="form-control bg-dark text-light border-success shadow-none font-monospace" id="recoverPhone" placeholder="08xxxxxxxx" maxlength="10" required>
                      </div>
                      <small class="text-secondary mt-2 d-block border-top border-secondary border-opacity-25 pt-2" style="font-size: 0.75rem;">
                          * ข้อมูลทั้ง 2 ส่วนต้องตรงกับฐานข้อมูลของบริษัท ระบบจึงจะแสดงรหัสผ่านให้
                      </small>
                      
                      <div id="recoverResult" class="d-none mt-4 p-3 rounded" style="background: rgba(0, 230, 118, 0.1); border: 1px dashed rgba(0, 230, 118, 0.5);">
                          <h6 class="text-success fw-bold mb-3"><i class="bi bi-check-circle-fill me-2"></i>ยืนยันตัวตนสำเร็จ:</h6>
                          <div class="d-flex justify-content-between align-items-center mb-2">
                              <span class="text-muted small">ชื่อผู้ใช้งาน (Username):</span>
                              <span class="text-white font-monospace fw-bold fs-6" id="resUsername"></span>
                          </div>
                          <div class="d-flex justify-content-between align-items-center">
                              <span class="text-muted small">รหัสผ่าน (Password):</span>
                              <span class="text-white font-monospace fw-bold fs-6" id="resPassword"></span>
                          </div>
                          <button type="button" class="btn btn-success btn-sm w-100 rounded-pill mt-3 fw-bold" onclick="window.useRecoveredAccount()">
                              นำไปเข้าสู่ระบบทันที
                          </button>
                      </div>

                      <div class="mt-4 text-end" id="recoverActionBtns">
                          <button type="button" class="btn btn-secondary rounded-pill px-4 me-2" data-bs-dismiss="modal">ยกเลิก</button>
                          <button type="submit" class="btn btn-success rounded-pill px-4 fw-bold" id="btnCheckRecover">ตรวจสอบข้อมูล</button>
                      </div>
                  </form>
              </div>
          </div>
      </div>
  </div>
</div>
