<div id="view-recruit" class="view-section container-fluid p-3 p-md-4">
    
    <!-- ส่วน Header สำหรับหน้า Recruit -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 border-bottom border-secondary border-opacity-25 pb-3">
        <h4 class="text-white fw-bold mb-0">
            <i class="bi bi-person-lines-fill text-success me-2"></i>ระบบพิจารณาใบสมัครงาน
        </h4>
        <div class="d-flex gap-2 mt-2 mt-md-0">
            <!-- ปุ่มนี้จะแสดงเฉพาะ Admin ที่กดเข้ามาดู -->
            <button id="btnBackToAdmin" class="btn btn-sm btn-outline-light rounded-pill px-3 shadow-sm hover-scale" style="display:none;" onclick="window.switchView('view-admin')">
                <i class="bi bi-arrow-left me-1"></i> กลับหน้า Admin
            </button>
            <button class="btn btn-sm btn-outline-danger rounded-pill px-3 shadow-sm hover-scale" onclick="window.logout()">
                <i class="bi bi-power me-1"></i> ออกจากระบบ
            </button>
        </div>
    </div>

    <!-- หน้า List รายชื่อผู้สมัคร -->
    <div id="recruitListView">
        <div id="recruitLoading" class="text-center py-5">
            <div class="spinner-border text-success" role="status"></div>
            <p class="mt-3 text-muted small">กำลังโหลดข้อมูลใบสมัคร...</p>
        </div>
        <div class="row g-3" id="recruitListGroup"></div>
    </div>

    <!-- หน้ารายละเอียดผู้สมัคร -->
    <div id="recruitDetailView" class="d-none">
        <div class="mb-3 position-relative z-3">
            <button class="btn btn-dark border-secondary btn-sm rounded-pill px-4 hover-scale" onclick="window.switchRecruitView('list')">
                <i class="bi bi-arrow-left me-2"></i>ย้อนกลับไปหน้ารายชื่อ
            </button>
        </div>
        
        <!-- ส่วนหัว (รูปโปรไฟล์ + ชื่อ + ตำแหน่ง + คะแนนสอบ) จัดเรียงแนวนอน -->
        <div class="card bg-black border-secondary rounded-4 shadow-sm mb-3">
            <div class="card-body p-3 p-md-4">
                <div class="d-flex flex-column flex-md-row align-items-center gap-4">
                    <img id="d_photo" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="rounded-circle object-fit-cover border border-3 border-success shadow-lg" style="width: 100px; height: 100px; background-color: #222;" referrerpolicy="no-referrer">
                    <div class="text-center text-md-start">
                        <h4 class="text-white fw-bold mb-2" id="d_name">-</h4>
                        <div class="d-flex flex-wrap justify-content-center justify-content-md-start gap-2">
                            <span class="badge bg-dark border border-secondary text-success px-3 py-2 rounded-pill shadow-sm" id="d_pos"><i class="bi bi-briefcase me-2"></i>-</span>
                            <span id="d_score_badge" class="badge bg-secondary px-3 py-2 rounded-pill shadow-sm">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- ส่วนข้อมูลส่วนตัว จัดเป็น 2 ฝั่ง -->
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <div class="card bg-black border-secondary rounded-4 h-100 shadow-sm">
                    <div class="card-body p-3 p-md-4">
                        <h6 class="text-success border-bottom border-secondary border-opacity-25 pb-2 mb-3 fw-bold">
                            <i class="bi bi-person-lines-fill me-2"></i>ข้อมูลส่วนตัว
                        </h6>
                        <div class="d-flex justify-content-between mb-2 pb-2 border-bottom border-secondary border-opacity-10"><span class="text-muted small">วันเกิด:</span> <span id="d_birth" class="text-light fw-bold">-</span></div>
                        <div class="d-flex justify-content-between mb-2 pb-2 border-bottom border-secondary border-opacity-10"><span class="text-muted small">อายุ:</span> <span id="d_age" class="text-light fw-bold">-</span></div>
                        <div class="d-flex justify-content-between mb-2 pb-2 border-bottom border-secondary border-opacity-10"><span class="text-muted small">เลขบัตร ปชช:</span> <span id="d_idcard" class="text-warning font-monospace">-</span></div>
                        <div class="d-flex justify-content-between"><span class="text-muted small">เบอร์โทรศัพท์:</span> <span id="d_phone" class="text-light font-monospace fw-bold">-</span></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card bg-black border-secondary rounded-4 h-100 shadow-sm">
                    <div class="card-body p-3 p-md-4">
                        <h6 class="text-warning border-bottom border-secondary border-opacity-25 pb-2 mb-3 fw-bold">
                            <i class="bi bi-car-front-fill me-2"></i>ข้อมูลใบขับขี่และรายได้
                        </h6>
                        <div class="d-flex justify-content-between mb-2 pb-2 border-bottom border-secondary border-opacity-10"><span class="text-muted small">ประเภทใบขับขี่:</span> <span id="d_licType" class="text-light fw-bold">-</span></div>
                        <div class="d-flex justify-content-between mb-2 pb-2 border-bottom border-secondary border-opacity-10"><span class="text-muted small">วันหมดอายุใบขับขี่:</span> <span id="d_licExp" class="text-danger fw-bold">-</span></div>
                        <div class="d-flex justify-content-between align-items-center mt-3 p-3 rounded" style="background: rgba(0, 230, 118, 0.05); border: 1px solid rgba(0, 230, 118, 0.2);">
                            <span class="text-success small fw-bold"><i class="bi bi-cash-stack me-1"></i>เงินเดือนที่คาดหวัง:</span> 
                            <span id="d_salary" class="text-white fw-bold fs-5">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- ส่วนเอกสารแนบ -->
        <div class="card bg-black border-secondary rounded-4 shadow-sm mb-3">
            <div class="card-body p-3 p-md-4">
                <h6 class="text-success border-bottom border-secondary border-opacity-25 pb-2 mb-3 fw-bold">
                    <i class="bi bi-paperclip me-2"></i>เอกสารแนบ
                </h6>
                <div class="d-flex gap-2 flex-wrap" id="d_docs_links"></div>
            </div>
        </div>
        
        <!-- ปุ่ม Action -->
        <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 d-flex flex-column flex-md-row justify-content-end gap-3">
            <button class="btn btn-outline-danger py-2 px-4 rounded-pill hover-scale" id="btnReject">
                <i class="bi bi-x-circle me-2"></i>ปฏิเสธใบสมัคร
            </button>
            <button class="btn btn-success fw-bold py-2 px-5 shadow-lg text-dark rounded-pill hover-scale" id="btnApprove" style="background: linear-gradient(135deg, #00E676, #00C853); border:none;">
                <i class="bi bi-check-circle-fill me-2"></i>รับเข้าทำงาน
            </button>
        </div>
    </div>
</div>
